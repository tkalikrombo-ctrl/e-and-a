name: Build Android and Windows apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # JDK 21 is required: capacitor.build.gradle compiles with JavaVersion.VERSION_21
      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint and sync native project
        run: |
          set -euo pipefail
          npm run lint
          npm run android:sync

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --info \
            -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" > ../gradle-build.log 2>&1
          code=$?
          set -e
          echo "gradle_exit=$code"
          msg="$(tail -n 40 ../gradle-build.log)"
          echo "::error title=Gradle failed::$(echo "$msg" | tr '\n' ' ')"
          echo '## Gradle failure' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n%s\n```\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit $code
        working-directory: android

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Prepare APK asset
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "::error title=APK not found::expected $apk"
            exit 1
          fi
          mkdir -p release
          cp "$apk" "release/EA-Android.apk"
          ls -l "release/EA-Android.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: EA-Android-APK
          path: release/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint and build Windows app
        run: |
          npm run lint
          npm run desktop:win

      - name: Upload Windows app
        uses: actions/upload-artifact@v5
        with:
          name: EA-Windows-App
          path: release/*.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android APK and Windows app
        uses: actions/download-artifact@v5
        with:
          pattern: EA-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'E&A ${{ github.ref_name }}'
          generate_release_notes: true
          files: release/*
          body: |
            Android debug APK and portable Windows app for direct testing.
            The Android APK is not signed for Google Play distribution.